
<!DOCTYPE html>

<head>

<title>Model Picker</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #848484; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .post { position: relative; width: 1024px; height: 768px; background: #848484; overflow: hidden; }

  .txt {
    position: absolute; white-space: nowrap; font-weight: 400; color: #fff; font-size: 15px;
    pointer-events: none;
    line-height: 52px;
    letter-spacing: 0px;
  }
  /* Figma "vertical align: top" on a text node with line-height 52 keeps the cap-height
     flush to the box's top edge — text-box-trim is the CSS equivalent of that behavior. */
  @supports (text-box-trim: trim-both) {
    .txt { text-box-trim: trim-both; text-box-edge: cap alphabetic; }
  }
  @supports not (text-box-trim: trim-both) {
    /* fallback for engines without text-box-trim: recenter the oversized line box
       so the glyphs land at the same spot they would with trim applied */
    .txt { transform: translateY(-18.5px); }
  }

  .divider { position: absolute; height: 1px; background: #3f3f3f; pointer-events: none; }

  /* hit areas: transparent, exact Figma bounding boxes, purely for interaction */
  .hit {
    position: absolute;
    cursor: pointer;
    border-radius: 12px;
    background: transparent;
    transition: background .1s ease, border-color .1s ease;
    border: 1px solid transparent;
  }
  .hit.pill-selected { background: #303a40; border-color: #313131; }
  .hit.pill-expander { background: #3a3a3a; border-color: #313131; }
  .hit.disabled { cursor: default; }

  .check {
    position: absolute;
    opacity: 0;
    transform: scale(.7);
    transition: opacity .12s ease, transform .12s ease;
  }
  .hit.pill-selected .check,
  .check.shown { opacity: 1; transform: scale(1); }

  /* ---------- Panel 1 ---------- */
  .panel-1 {
    position: absolute; left: 230px; top: 138px; width: 293px; height: 445px;
    background: #2d2d2d; border-radius: 22px; overflow: hidden;
  }

  .search-input {
    position: absolute; left: 18px; top: 15px; width: 257px; height: 24px;
    background: transparent; border: none; outline: none;
    font: 400 15px/1 'Inter', sans-serif; color: #fff;
  }
  .search-input::placeholder { color: #a7a6a7; }

  .divider-1 { left: 18px; top: 54px; width: 257px; }

  .label-optional { left: 18px; top: 76px; font-size: 14px; font-weight: 500; color: #a7a6a7; }

  .row-auto { left: 18px; top: 108px; }
  .row-multiple { left: 18px; top: 142px; }

  .toggle-hit { position: absolute; width: 40px; height: 30px; cursor: pointer; border-radius: 8px; }
  .toggle-hit.auto { left: 236px; top: 97px; }
  .toggle-hit.multi { left: 236px; top: 131px; }
  .toggle-hit.temp { left: 236px; top: 402px; }

  .switch { position: absolute; width: 33px; height: 20px; border-radius: 999px; background: #1c1c1c; border: 1px solid #444; transition: background .15s, border-color .15s; pointer-events: none; }
  .switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#6b6b6b; transition: transform .15s ease, background .15s; }
  .switch.checked { background:#2f7ce6; border-color:#2f7ce6; }
  .switch.checked::after { background:#fff; transform: translateX(13px); }
  .switch.auto { left: 240px; top: 103px; }
  .switch.multi { left: 240px; top: 137px; }
  .switch.temp { left: 240px; top: 408px; }

  .label-models { left: 18px; top: 187px; font-size: 14px; font-weight: 500; color: #a7a6a7; }

  .hit-more-models {
    left: 5px; top: 207px; width: 283px; height: 34px;

    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 13px;
  }
  .txt-more-models { position: static; }
  .chev-more-models { position: static; flex-shrink: 0; }

  .icon { display: block; position: absolute; pointer-events: none; }

<script>
(function () {
  // Toggle switches
  document.querySelectorAll('[data-toggle-hit]').forEach(function (hit) {
    hit.addEventListener('click', function () {
      var key = hit.dataset.toggleHit;
      var sw = document.getElementById('sw-' + key);
      sw.classList.toggle('checked');
    });
  });

  // Model selection, single-select per group (per-panel)
  document.querySelectorAll('[data-model-hit]').forEach(function (hit) {
    hit.addEventListener('click', function () {
      var group = hit.dataset.group;
      document.querySelectorAll('[data-model-hit][data-group="' + group + '"]').forEach(function (h) {
        h.classList.remove('pill-selected');
        var c = h.querySelector('.check');
        if (c) c.classList.remove('shown');
      });
      hit.classList.add('pill-selected');
      var check = hit.querySelector('.check');
      if (check) check.classList.add('shown');
    });
  });

  // "Ask for a model" -> inline input
  var askHit = document.getElementById('ask-hit');
  askHit.addEventListener('click', function () {
    var label = document.getElementById('ask-label');
    if (label.style.display === 'none') return;
    label.style.display = 'none';
    var input = document.createElement('input');
    input.className = 'ask-input';
    input.type = 'text';
    input.placeholder = 'Type a model name...';
    label.insertAdjacentElement('afterend', input);
    input.focus();
    function revert() {
      if (input.value.trim()) label.textContent = input.value.trim();
      input.remove();
      label.style.display = '';
    }
    input.addEventListener('blur', revert);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = ''; input.blur(); }
    });
    input.addEventListener('click', function (e) { e.stopPropagation(); });
  });
})();
</script>
