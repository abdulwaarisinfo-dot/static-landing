/* ===== Refinements v2 ===== */
body{font-size:13.5px;letter-spacing:-.003em}
.card{box-shadow:0 1px 2px #2a1e1408;border-radius:10px;padding:14px 16px}.kv{font-size:22px;letter-spacing:-.02em}
th{text-transform:uppercase;letter-spacing:.04em;font-size:11px}td{padding:9px 8px}
.b{border-radius:6px;padding:2px 8px;font-size:11.5px;display:inline-flex;align-items:center;gap:5px}.b:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.nv{transition:background .12s,color .12s;position:relative}.nv.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ac)}
.nvh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:14px 10px 4px}
.nb{margin-left:auto;background:var(--ac);color:var(--on);border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}

/* ===== Foodcode-inspired theme v3 ===== */
:root{--bg:#f3f5f6;--bd:#e2e7e9;--mu:#667075;--tx:#161a1d;--ac:#0e5c63;--on:#fff;--acs:#dfeeef;--gy:#edf0f1;--gn:#1f7a4d;--gns:#def2e5;--am:#a0650a;--ams:#fcefd6;--rd:#bd3629;--rds:#fbe1de}


body{font-size:14px}aside{background:var(--bg)}
.rs{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:10px 12px;margin:0 0 10px}.rs p{margin:0}
.nv{font-size:14.5px;border:1px solid transparent;border-radius:9px}.nv.on{background:var(--sf);border-color:var(--bd);color:var(--tx);font-weight:500}.nv.on:before{display:none}.nv.on svg{color:var(--ac)}
.nb{background:var(--gns);color:var(--gn);border-radius:6px}
.who{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px}
.card{border-radius:14px;box-shadow:none;padding:16px}.card h3,.qq h3{font-size:15px;font-weight:600}
.b{border-radius:5px;border:1px solid color-mix(in srgb,currentColor 28%,transparent)}.b:before{display:none}

.tabs{display:inline-flex;background:var(--gy);padding:4px;border-radius:10px;max-width:100%}.tabs button{border-radius:8px;font-size:13px}.tabs button.on{background:var(--sf);color:var(--tx);box-shadow:0 0 0 1px var(--bd)}
.chip{border:1px solid var(--bd);border-radius:6px;padding:2px 8px;display:inline-flex;background:var(--sf);font-size:12px;color:var(--mu)}
.qq{background:var(--gy);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:16px}.qg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}.qc:hover{border-color:var(--ac)}.qc p{margin:0}
.posg{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
.pc{border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}.pc p{margin:0}.pc .bt{width:100%;justify-content:center;margin-top:auto}
.pt{height:92px;width:100%;border-radius:8px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:24px;font-weight:600}
.cart{position:sticky;top:76px}.stp{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:8px;background:var(--gy)}.stp button{border:0;background:none;width:32px;height:32px}.stp b{min-width:24px;text-align:center}
.tot{background:var(--gy);border-radius:10px;padding:8px 12px;margin:12px 0}.tot .li{border:0;padding:3px 0}

/* ===== White theme v4 ===== */
:root{--bg:#fff;--gy:#f6f7f8;--bd:#e5e8ea;color-scheme:light}aside{background:#fff}
.ag{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* ===== Button system v5 ===== */
:root{--r-btn:10px;--ease:cubic-bezier(.2,.8,.2,1);--t:160ms;--tap:36px;--ib:36px;--hl:rgba(255,255,255,.18);
--sh-1:0 1px 2px color-mix(in srgb,var(--tx) 8%,transparent);--sh-2:0 8px 20px -6px color-mix(in srgb,var(--tx) 20%,transparent);
--sh-ac:0 4px 12px -3px color-mix(in srgb,var(--ac) 45%,transparent);--ring:color-mix(in srgb,var(--ac) 75%,transparent);--press:color-mix(in srgb,var(--gy) 60%,var(--bd))}
@media(pointer:coarse){:root{--tap:44px;--ib:40px}}
button{transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),box-shadow var(--t) var(--ease),transform var(--t) var(--ease),opacity var(--t) var(--ease);-webkit-tap-highlight-color:transparent}
button:focus-visible,.shl:focus-visible,summary:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
/* Secondary */
.bt{min-height:var(--tap);padding:8px 14px;gap:8px;border-radius:var(--r-btn);border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:13.5px;font-weight:500;letter-spacing:-.005em;line-height:1.2;box-shadow:var(--sh-1);justify-content:center;position:relative}
.bt:hover:not(:disabled){background:var(--gy);border-color:color-mix(in srgb,var(--bd) 60%,var(--mu))}
.bt:active:not(:disabled){transform:scale(.98);box-shadow:none;background:var(--press)}
/* Primary */
.bt.pr{border-color:var(--ac);color:var(--on);font-weight:600;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 90%,var(--on)),var(--ac));box-shadow:inset 0 1px 0 var(--hl),var(--sh-ac)}
.bt.pr:hover:not(:disabled){background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 82%,var(--on)),color-mix(in srgb,var(--ac) 94%,var(--on)));border-color:var(--ac);opacity:1;transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--hl),0 6px 14px -4px color-mix(in srgb,var(--ac) 55%,transparent)}
.bt.pr:active:not(:disabled){background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 92%,var(--tx)));transform:scale(.98);box-shadow:inset 0 1px 0 var(--hl),0 1px 2px color-mix(in srgb,var(--ac) 40%,transparent)}
/* Danger */
.bt.dg{color:var(--rd)}
.bt.dg:hover:not(:disabled){background:var(--rds);border-color:color-mix(in srgb,var(--rd) 45%,transparent)}
.bt.dg:active:not(:disabled){background:color-mix(in srgb,var(--rds) 80%,var(--rd))}
.md .row>.bt.dg{background:var(--rd);border-color:var(--rd);color:var(--on);font-weight:600}
.md .row>.bt.dg:hover:not(:disabled){background:color-mix(in srgb,var(--rd) 88%,var(--tx));border-color:var(--rd)}
/* Icon + avatar */
.bt.ib{width:var(--ib);min-width:var(--ib);height:var(--ib);min-height:var(--ib);padding:0}
button.av{width:var(--ib);height:var(--ib);border:1px solid transparent;cursor:pointer;font-size:12.5px}
button.av:hover:not(:disabled){box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent);border-color:color-mix(in srgb,var(--ac) 35%,transparent)}
button.av:active:not(:disabled){transform:scale(.95)}
/* Ghost: nav, menus, links */
.nv{min-height:var(--tap);gap:10px;border-radius:var(--r-btn);font-weight:500;font-size:14px;color:var(--mu);background:transparent}
.nv:hover:not(.on):not(:disabled){background:var(--gy);color:var(--tx)}.nv:active:not(:disabled){transform:scale(.99);background:var(--press)}
.nv.on{background:var(--sf);border-color:var(--bd);color:var(--tx);box-shadow:var(--sh-1)}.nv.on svg{color:var(--ac)}
.pop{box-shadow:var(--sh-2)}.pop button{min-height:var(--tap);padding:8px 10px;border-radius:8px;background:transparent;font-size:13.5px}
.pop button:hover:not(:disabled){background:var(--gy)}.pop button:active:not(:disabled){background:var(--press)}
.shl{display:inline-flex;align-items:center;min-height:var(--tap);padding:6px 12px;border-radius:var(--r-btn);font-size:13.5px;font-weight:500}.shl:active{background:var(--press)}
/* Segmented tabs */
.tabs{padding:3px;gap:2px;border-radius:12px}
.tabs button{min-height:calc(var(--tap) - 6px);padding:6px 14px;border:0;border-radius:9px;background:transparent;color:var(--mu);font-size:13.5px;font-weight:500}
.tabs button:hover:not(.on):not(:disabled){color:var(--tx);background:color-mix(in srgb,var(--bd) 45%,transparent)}
.tabs button.on{background:var(--sf);color:var(--tx);box-shadow:0 0 0 1px var(--bd),var(--sh-1)}.tabs button:active:not(:disabled){transform:scale(.97)}
/* Toggle */
.sw{width:40px;height:24px;flex:none;border-radius:99px;border:0;padding:0;background:color-mix(in srgb,var(--mu) 35%,var(--bd));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mu) 30%,transparent)}
.sw:after{left:3px;top:3px;width:18px;height:18px;background:var(--sf);box-shadow:var(--sh-1);transition:transform 180ms cubic-bezier(.34,1.4,.64,1),width 180ms var(--ease)}
.sw.on{background:var(--gn);box-shadow:none}.sw.on:after{left:3px;transform:translateX(16px)}
.sw:active:not(:disabled):after{width:22px}.sw.on:active:not(:disabled):after{transform:translateX(12px)}
/* Stepper */
.stp{display:inline-flex;border-radius:var(--r-btn);overflow:hidden;border:1px solid var(--bd);background:var(--sf);box-shadow:var(--sh-1)}
.stp button{width:var(--ib);height:var(--ib);border:0;background:transparent;font-size:16px;color:var(--tx)}
.stp b{min-width:28px;display:grid;place-items:center;border-inline:1px solid var(--bd)}
.stp button:hover:not(:disabled){background:var(--gy)}.stp button:active:not(:disabled){background:var(--press);transform:scale(.94)}
/* List rows */
.ci{border:0;border-radius:10px;margin-bottom:2px;padding:10px 12px;min-height:var(--tap);background:transparent;position:relative}
.ci:hover{background:var(--gy)}.ci:active{background:var(--press)}.ci.on{background:var(--acs)}
.ci.on:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--ac)}
.li.bt{box-shadow:none;border-color:transparent;background:transparent;border-radius:10px;padding:10px 12px;font-weight:400;text-align:left}
.li.bt:hover:not(:disabled){background:var(--gy);border-color:transparent}.li.bt:active:not(:disabled){transform:none;background:var(--press)}
/* Kitchen */
.kcard .bt.pr{width:100%;min-height:44px;font-size:14.5px}
/* FAQ summary */
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:var(--tap);padding:6px 10px;margin:0 -10px;border-radius:var(--r-btn);transition:background-color var(--t) var(--ease)}
summary::-webkit-details-marker{display:none}summary:hover{background:var(--gy)}
summary:after{content:"";flex:none;width:7px;height:7px;border:solid var(--mu);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);transition:transform var(--t) var(--ease)}details[open] summary:after{transform:rotate(225deg)}
/* Loading */
.bt[aria-busy=true]{color:transparent!important;pointer-events:none}
.bt[aria-busy=true]:after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--bd);border-top-color:var(--ac);animation:spin .7s linear infinite}
.bt.pr[aria-busy=true]:after{border-color:color-mix(in srgb,var(--on) 35%,transparent);border-top-color:var(--on)}@keyframes spin{to{transform:rotate(360deg)}}
/* Disabled (keep last) */
button:disabled{opacity:.45;cursor:not-allowed;transform:none}.bt:disabled,.bt.pr:disabled{box-shadow:none}
input:disabled,select:disabled,textarea:disabled{background:var(--gy);color:var(--mu);cursor:not-allowed}
/* ===== Button fixes (v5 follow-up) ===== */
.li.bt{justify-content:space-between}
.bt.hb{display:none}
/* ===== Homepage v6 ===== */
:root{--pc:#f6d7c3;--pc2:#f2b896;--ch:#1d2226;--ch2:#2a3136;--wm:#faf7f3;--wm2:#f4efe9;--hair:rgba(29,34,38,.1);--sh-3:0 30px 60px -28px rgba(29,34,38,.3),0 2px 6px rgba(29,34,38,.05)}
html{scroll-behavior:smooth}
.lp{background:var(--wm);overflow-x:clip;font-size:15px;line-height:1.55}
.lp a{color:inherit}
.lp :is(a,button,summary):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.lp .dk :is(a,button,summary):focus-visible,.lp .fin :is(a,button):focus-visible,.lp .fc.dk :is(a,button):focus-visible{outline-color:#fff}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.w{max-width:1120px;margin:0 auto;padding:0 24px}
.lp main.lpm{padding:0;max-width:none}
/* nav: pill inside rounded frame */
.lp header.sh{position:sticky;top:0;z-index:20;display:block;background:transparent;border:0;padding:12px 16px 0}
.shf{max-width:1120px;margin:0 auto;border:1px solid var(--hair);border-radius:28px;padding:6px;background:color-mix(in srgb,var(--wm) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.shi{display:flex;align-items:center;gap:2px;padding:4px 6px 4px 16px;margin:0;width:auto;max-width:none;background:var(--sf);border:1px solid var(--bd);border-radius:999px;box-shadow:var(--sh-1)}
.shi .logo{padding:0;margin-right:8px;font-size:15px;letter-spacing:-.02em}.shi .logo i{border-radius:7px}
.shl{text-decoration:none;color:var(--mu);border-radius:999px}.shl:hover{color:var(--tx);background:var(--gy)}
.bt.shc{border-radius:999px;margin-left:6px}.shi .bt.ib{border-radius:50%}
.mm{display:none}.mm.open{display:flex;flex-direction:column;gap:2px;padding:8px 6px 6px}.mm .shl{display:flex;padding:10px 14px}.mm .bt{margin-top:6px}
/* CTA pill with circular chevron chip */
.bt.pl{border-radius:999px;min-height:52px;padding:6px 22px;font-size:15px}
.bt.pr.pl{padding:6px 6px 6px 22px}
.cx{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);flex:none;transition:transform var(--t) var(--ease)}
.bt.pr.pl:hover .cx{transform:translateX(2px)}
.bt.pl.lt{background:#fff;border-color:#fff;color:var(--ch)}.bt.pl.lt:hover:not(:disabled){background:var(--pc);border-color:var(--pc)}.bt.pl.lt .cx{background:var(--ch);color:#fff}
.bt.pl.gh{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);box-shadow:none}.bt.pl.gh:hover:not(:disabled){background:rgba(255,255,255,.1)}
.bt.pg2{border-radius:999px;padding:6px 18px 6px 14px}
/* type */
.eb{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin-bottom:16px}
.eb:before{content:"";width:18px;height:2px;border-radius:2px;background:var(--pc2)}
.ttl{font-size:clamp(30px,4.2vw,48px);line-height:1.05;letter-spacing:-.04em;font-weight:600;max-width:15em;text-wrap:balance}.ttl span,.fin h2 span{display:block;color:var(--mu)}
.sbt{color:var(--mu);font-size:17px;max-width:36em;margin-top:16px}
.ps{padding:104px 0;scroll-margin-top:72px}.ps.tight{padding-top:24px}
.shd{margin-bottom:48px}
/* hero */
.hero2{padding:56px 0 104px}
.hg{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:32px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--mu);background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:6px 14px 6px 10px;margin-bottom:24px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.hero2 h1{font-size:clamp(40px,5.1vw,64px);line-height:1.02;letter-spacing:-.04em;font-weight:600;max-width:11.5em;text-wrap:balance}.hero2 h1 span{color:var(--mu)}
.lead2{font-size:18px;color:var(--mu);max-width:29em;margin:22px 0 32px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{margin-top:22px;font-size:13px;color:var(--mu);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* collage */
.col2{position:relative;height:540px}
.blob{position:absolute;inset:3% 0 3% 10%;border-radius:46% 54% 52% 48%/52% 44% 56% 48%;background:radial-gradient(70% 70% at 35% 30%,var(--pc) 0,var(--pc) 40%,color-mix(in srgb,var(--pc2) 60%,var(--pc)) 100%)}
.fc{position:absolute;border-radius:22px;box-shadow:0 18px 40px -16px rgba(29,34,38,.35),0 2px 6px rgba(29,34,38,.06);transform:rotate(var(--r,0deg));animation:fi .7s var(--ease) var(--d,0s) both,fl 5s ease-in-out calc(var(--d,0s) + .7s) 1}
@keyframes fi{from{opacity:0;transform:translateY(18px) rotate(var(--r,0deg))}to{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-6px) rotate(var(--r,0deg))}}
.c1{top:5%;left:0;width:318px;--r:-2deg;--d:.05s;background:var(--sf);padding:16px}
.c2{top:1%;right:3%;--r:2deg;--d:.2s;background:var(--ch);color:#fff;border-radius:999px;padding:9px 18px 9px 10px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:14px;z-index:2}
.c3{top:29%;right:0;width:262px;--r:1.5deg;--d:.3s;background:var(--ch);color:#fff;padding:18px;z-index:1}
.c4{bottom:1%;left:5%;width:244px;--r:-1.5deg;--d:.4s;background:var(--sf);padding:6px}
.c5{bottom:5%;right:2%;width:258px;--r:2deg;--d:.5s;background:var(--sf);padding:14px;display:flex;gap:12px;align-items:center;z-index:2}
.fc .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mu);margin-bottom:12px}
.vb{display:flex;align-items:center;gap:10px;background:var(--acs);border-radius:16px 16px 4px 16px;padding:10px 12px;color:var(--ac)}
.pbt{width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none}
.tmr{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ac);font-weight:600}
.trs{margin-top:10px;font-size:13.5px}.trs small{display:block;color:var(--mu);font-size:11.5px;margin-bottom:2px}
.wf{display:flex;align-items:center;gap:2px;height:26px;flex:1;min-width:0}
.wf i{flex:1;max-width:3px;min-width:2px;height:calc(var(--h)*26px);border-radius:2px;background:currentColor;opacity:.6}
.tick{width:26px;height:26px;border-radius:50%;background:var(--pc);color:var(--ch);display:grid;place-items:center;flex:none}
.dr2{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.82)}
.dr2.t{border:0;color:#fff;font-weight:600;font-size:15px;padding-bottom:0}.dr2.t b{color:var(--pc)}
.c3 .hd2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12.5px;color:rgba(255,255,255,.72)}.c3 .hd2 b{color:#fff;font-size:14px}
.sg{display:grid;grid-template-columns:1fr 1fr}.sg div{padding:12px 14px;border-bottom:1px solid var(--hair)}.sg div:nth-child(odd){border-right:1px solid var(--hair)}.sg div:nth-child(n+3){border-bottom:0}
.sg b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.1}.sg span{font-size:12px;color:var(--mu)}
.ncic{width:38px;height:38px;border-radius:12px;background:var(--pc);color:var(--ch);display:grid;place-items:center;flex:none}
.c5 b{display:block;font-size:14px;letter-spacing:-.01em}.c5 span{font-size:12.5px;color:var(--mu)}
/* sequence */
.sqc{background:var(--sf);border:1px solid var(--hair);border-radius:28px;padding:20px;box-shadow:var(--sh-3)}
.sqh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 4px 16px}
.sqs{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;background:var(--wm2);border-radius:22px;padding:20px;align-items:stretch}
.phn{background:#fff;border:1px solid var(--hair);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;height:500px;box-shadow:0 14px 30px -18px rgba(29,34,38,.35)}
.phh{background:var(--ac);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center}.phh small{display:block;font-size:11.5px;opacity:.85}
.pav{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--ac);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.phb{flex:1;min-height:0;background:var(--wm2);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden}
.phf{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#fff;border-top:1px solid var(--hair)}
.phf span:first-child{flex:1;background:var(--gy);border-radius:999px;padding:9px 14px;color:var(--mu);font-size:13px}
.mic{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none}
[data-f]:not(.on){display:none}
[data-f].on{animation:pi .45s var(--ease) both}
@keyframes pi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mg{max-width:88%;padding:9px 12px;border-radius:16px;font-size:13.5px;box-shadow:0 1px 1px rgba(29,34,38,.06)}
.mg.me{align-self:flex-end;background:var(--acs);border-bottom-right-radius:4px;color:var(--tx)}
.mg.ag{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.mg.trn{align-self:flex-end;background:transparent;box-shadow:none;padding:0 4px;font-size:12.5px;color:var(--mu);text-align:right}
.mg.trn q{display:block;quotes:none;color:var(--tx);font-size:13.5px;min-height:1.5em}
.vn{display:flex;align-items:center;gap:10px;color:var(--ac);min-width:210px}
#sqx.ty:after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--ac);animation:cr .7s steps(1) infinite}
@keyframes cr{50%{opacity:0}}
.rec .vn .wf i{animation:wv .9s ease-in-out calc(var(--i)*-60ms) infinite}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.dbp{background:#fff;border:1px solid var(--hair);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:500px}
.dbh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dcol{background:var(--wm2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.dcol h4{margin:0;font-size:12.5px;color:var(--mu);font-weight:500;display:flex;justify-content:space-between}
.eps{border:1px dashed var(--bd);border-radius:14px;padding:22px 14px;text-align:center;color:var(--mu);font-size:13px}
.ocard{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh-2)}
.ocard.on{animation:sli .6s var(--ease) both}
@keyframes sli{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
.ocard .li{padding:6px 0}
.ocard .bt{width:100%;margin-top:12px}
.bt.tap{transform:scale(.97);box-shadow:none}
.bt.ok:disabled{opacity:1;background:var(--gns);border-color:transparent;color:var(--gn)}
.swap{animation:sw .4s var(--ease)}@keyframes sw{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
.tln{list-style:none;margin:16px 0 2px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.tln .tf{position:absolute;left:12.5%;right:12.5%;top:7px;height:2px;background:var(--bd);padding:0}.tf i{display:block;height:100%;background:var(--ac);transform-origin:left;transform:scaleX(0);transition:transform 500ms var(--ease)}
.tn{text-align:center;font-size:12px;color:var(--mu);padding:0}.tn span{display:block;margin:0 auto 6px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--bd);position:relative;z-index:1;transition:background-color .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
.tn.d{color:var(--tx);font-weight:500}.tn.d span{background:var(--ac);border-color:var(--ac);transform:scale(1.1)}
.earl{opacity:.72}.earl .hl{padding:8px 0}
.sqcap{margin:16px 4px 4px;font-size:14px;color:var(--mu);min-height:1.5em}.sqcap b{color:var(--tx)}
.sqn{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sqn button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;min-height:var(--tap);padding:10px 10px 12px;border:0;border-radius:14px;background:transparent;text-align:left;color:var(--mu);font-size:13px;font-weight:500;line-height:1.25}
.sqn button:hover{background:var(--gy);color:var(--tx)}.sqn button.cur,.sqn button.d{color:var(--tx)}
.sqn .bar{display:block;height:3px;width:100%;border-radius:2px;background:var(--bd);overflow:hidden}
.sqn .bar i{display:block;height:100%;background:var(--ac);transform-origin:left;transform:scaleX(0)}
.sqn .d .bar i{transform:none}.sqn .cur .bar i{animation:pg var(--dur,3000ms) linear forwards}
@keyframes pg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sqn small{font-size:11.5px;color:var(--ac);font-weight:600;letter-spacing:.04em}
.paused .cur .bar i,.paused .rec .wf i{animation-play-state:paused}
.nq,.nq *{animation:none!important;transition:none!important}
/* bento */
.bn{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.k7{grid-column:span 7}.k5{grid-column:span 5}.k4{grid-column:span 4}.k12{grid-column:span 12}
.bx{background:var(--sf);border:1px solid var(--hair);border-radius:24px;padding:26px;overflow:hidden;position:relative;display:flex;flex-direction:column;gap:20px;min-height:280px}
.bx h3{font-size:20px;letter-spacing:-.025em;font-weight:600;margin:0 0 6px}.bx p{color:var(--mu)}
.bx.dk{background:var(--ch);border-color:var(--ch);color:#fff}.bx.dk p{color:rgba(255,255,255,.74)}
.bx.pc{background:var(--pc);border-color:transparent}.bx.pc p{color:#464e53}
.vz{margin-top:auto}
.tg{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18)}
.tg.on2{background:var(--pc);color:var(--ch);border-color:transparent}
.bx.dk .wf{color:var(--pc);height:44px}.bx.dk .wf i{height:calc(var(--h)*44px);opacity:.9;animation:wv 1.1s ease-in-out calc(var(--i)*-70ms) 4}
.bx.dk .wf i{flex:1;max-width:6px}
.mr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--wm);margin-bottom:6px;font-size:14px}
.mr.off{background:transparent;border:1px dashed var(--bd);color:var(--mu)}.mr.off span:first-child{display:flex;gap:8px;align-items:center;text-decoration:line-through}
.rc{background:var(--wm);border-radius:16px;padding:14px 16px}.rc .li{padding:6px 0;font-size:13.5px}.rc .li:last-child{border:0}
.hv .bub{background:var(--wm);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--gy);border-radius:999px;padding:4px;font-size:13px;font-weight:500;text-align:center}
.seg span{position:relative;z-index:1;padding:8px 6px}
.seg:before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:999px;background:var(--ac);animation:sg 4.8s var(--ease) 1 both}
.seg span:first-child{color:#fff;animation:sa 4.8s linear 1 both}.seg span:last-child{animation:sb 4.8s linear 1 both;color:var(--tx)}
@keyframes sg{0%,20%{transform:none}30%,70%{transform:translateX(100%)}80%,100%{transform:none}}
@keyframes sa{0%,20%{color:#fff}29%,71%{color:var(--tx)}80%,100%{color:#fff}}
@keyframes sb{0%,20%{color:var(--tx)}29%,71%{color:#fff}80%,100%{color:var(--tx)}}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kb div{background:var(--wm);border-radius:14px;padding:10px}.kb h4{margin:0 0 8px;font-size:12px;color:var(--mu);font-weight:500;display:flex;justify-content:space-between}.kb h4 b{color:var(--tx)}
.kb i{display:block;height:26px;border-radius:8px;background:#fff;border:1px solid var(--hair);margin-bottom:5px}
.sts{display:flex;gap:28px;flex-wrap:wrap}.sts b{display:block;font-size:26px;letter-spacing:-.03em;line-height:1.1}.sts span{font-size:13px;color:#464e53}
.bx.pc .sk{height:72px}
/* charts */
.kpg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpc{background:var(--sf);border:1px solid var(--hair);border-radius:20px;padding:20px}
.kpc .kl{font-size:13px;color:var(--mu)}.kpc .kvv{font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1.15;margin:4px 0 2px}.kpc .ks{font-size:12.5px;color:var(--mu)}
.sk{display:block;width:100%;height:36px;margin-top:12px;overflow:visible}
.skl{fill:none;stroke:var(--ac);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.cg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.g8{grid-column:span 8}.g4c{grid-column:span 4}.g6{grid-column:span 6}
.chc{background:var(--sf);border:1px solid var(--hair);border-radius:24px;padding:24px;margin:0}
.chc header,.chc .chh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.chc h3{font-size:16px;letter-spacing:-.02em;margin:0 0 2px}.chc .cs{font-size:13px;color:var(--mu)}
.cw{position:relative;margin:0 0 26px 30px}.cw svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke}
.ax{position:absolute;font-size:11.5px;line-height:1;color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.ax.y{right:100%;margin-right:8px;transform:translateY(-50%)}.ax.x{top:100%;margin-top:9px;transform:translateX(-50%)}
.ln{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 700ms var(--ease) .15s}
.in .ln{stroke-dashoffset:0}
.ar{opacity:0;transition:opacity 700ms var(--ease) .3s}.in .ar{opacity:1}
.pts{position:absolute;inset:0}
.pt{position:absolute;top:0;height:100%;border:0;padding:0;background:transparent;border-radius:8px}
.pt i{position:absolute;left:50%;top:var(--y);width:11px;height:11px;margin:-5.5px;border-radius:50%;background:#fff;border:2.5px solid var(--ac);transform:scale(0);transition:transform 160ms var(--ease)}
.pt.pk i{transform:scale(1);border-color:var(--ch)}
.pt:hover i,.pt:focus-visible i{transform:scale(1.15)}
.pt:focus-visible{outline:2px solid var(--ac);outline-offset:-2px;background:color-mix(in srgb,var(--ac) 7%,transparent)}
.pt .tt{position:absolute;left:50%;top:var(--y);transform:translate(-50%,calc(-100% - 6px));background:var(--ch);color:#fff;font-size:12px;line-height:1.3;padding:6px 10px;border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 160ms var(--ease);z-index:3}
.pt:hover .tt,.pt:focus-visible .tt{opacity:1}
.pt.l .tt{transform:translate(-14%,calc(-100% - 12px))}.pt.r .tt{transform:translate(-86%,calc(-100% - 12px))}
.pt .tt{margin-top:-6px}
.donut{position:relative;width:min(100%,200px);margin:4px auto 18px}.donut svg{display:block;width:100%;height:auto}
.dn{fill:none;stroke-width:14;stroke-dasharray:0 100;stroke-dashoffset:var(--o,0);transition:stroke-dasharray 700ms var(--ease) .15s}
.in .dn{stroke-dasharray:var(--v) 100}
.dtrk{fill:none;stroke:var(--pc);stroke-width:14}
.dcn{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.dcn b{display:block;font-size:28px;letter-spacing:-.04em;line-height:1}.dcn span{display:block;font-size:12px;color:var(--mu)}

const G={overview:'Operations',menu:'Restaurant'};
const bc=k=>{const n=k=='orders'?S.orders.filter(o=>o.st=='New').length:k=='conversations'?S.convs.filter(c=>c.att).length:0;return n?`<span class="nb">${n}</span>`:''};
const KEY='uc-demo-v3',PK=['menu','orders','convs','log','set','integ','ag'];
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)PK.forEach(k=>d[k]&&(S[k]=d[k]))}catch(e){}}
function save(){try{const d={};PK.forEach(k=>d[k]=S[k]);localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function resetDemo(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
load();render();setTimeout(()=>{S.load=false;render()},400);
</script></body></html>
